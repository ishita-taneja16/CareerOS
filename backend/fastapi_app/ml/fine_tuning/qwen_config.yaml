# Qwen Fine-Tuning Hyperparameters for CareerOS

model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  output_dir: "./checkpoints/qwen_career_lora"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 3
  logging_steps: 10
  save_strategy: "epoch"
  fp16: true
