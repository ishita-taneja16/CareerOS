lora:
  bias: none
  lora_alpha: 32
  lora_dropout: 0.05
  r: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  task_type: CAUSAL_LM
model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  max_seq_length: 512
  model_revision: main
  output_dir: ./checkpoints/qwen_career_lora
training:
  bf16: false
  eval_strategy: epoch
  fp16: true
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 0.0002
  logging_steps: 5
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  num_train_epochs: 3
  optim: paged_adamw_8bit
  per_device_eval_batch_size: 2
  per_device_train_batch_size: 2
  save_strategy: epoch
  save_total_limit: 2
  seed: 42
  warmup_ratio: 0.05
  weight_decay: 0.01
